<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gradient Hero</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
  <div class="nav-container">
    <img class="nav-logo" src="assets/logo.png" alt="Syrian Cloud Computing" />

    <nav class="nav-center">
      <a href="#">What We Do</a>
      <a href="#">Our Philosophy</a>
      <a href="#">Insights</a>
    </nav>

    <a class="nav-cta" href="#">Get In Touch ↗</a>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="bg">
    <div class="layer layer-back"></div>
    <div class="layer layer-mid"></div>
    <div class="layer layer-front"></div>
    <div class="vignette"></div>
  </div>

  <div class="content">
    <span class="pill">New Background</span>
  
    <h1>
      Smooth gradients make<br />
      everything better
    </h1>
  
    <div class="actions">
      <button class="primary">Get Started</button>
      <button class="secondary">Learn More</button>
    </div>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
